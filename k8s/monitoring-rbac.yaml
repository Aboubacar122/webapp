# Lien Lab 5 : Prometheus (mon-01, hors cluster) lit les pods webapp via l'API Kubernetes.
# Droits minimaux : lister/surveiller les pods et lire /metrics via le proxy de l'API, dans le seul namespace webapp.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-externe
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-lecture-webapp
  namespace: webapp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-lecture-webapp
  namespace: webapp
subjects:
  - kind: ServiceAccount
    name: prometheus-externe
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-lecture-webapp
