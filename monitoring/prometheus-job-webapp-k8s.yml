  - job_name: webapp-k8s
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/k8s/ca.crt
    authorization:
      credentials_file: /etc/prometheus/k8s/token
    kubernetes_sd_configs:
      - role: pod
        api_server: https://192.168.184.80:6443
        namespaces:
          names: [webapp]
        tls_config:
          ca_file: /etc/prometheus/k8s/ca.crt
        authorization:
          credentials_file: /etc/prometheus/k8s/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: webapp
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: __metrics_path__
        replacement: /api/v1/namespaces/webapp/pods/${1}:3000/proxy/metrics
      - target_label: __address__
        replacement: 192.168.184.80:6443
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: server
        replacement: k3s
      - target_label: app
        replacement: webapp
